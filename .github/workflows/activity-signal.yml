name: Generate Activity Signal

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"
  push:
    branches: [main, master]
    paths:
      - "scripts/generate-activity-graph.js"
      - "scripts/generate-developer-data.js"
      - ".github/workflows/activity-signal.yml"

permissions:
  contents: write

jobs:
  build-activity-signal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate activity graph (real GitHub data)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
        run: node scripts/generate-activity-graph.js

      - name: Generate developer data panel (stats + languages)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
        run: node scripts/generate-developer-data.js

      - name: Publish to activity-output branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -b activity-output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add activity-signal.svg developer-metrics-v2.svg
          git commit -m "chore: update activity signal"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" activity-output
