name: Generate Contribution Snake

on:
  # Atualiza a cada 12 horas
  schedule:
    - cron: "0 */12 * * *"
  # Permite rodar manualmente pela aba Actions
  workflow_dispatch:
  # Roda também quando algo é enviado para a branch principal
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  generate:
    name: Generate snake animation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Gera os SVGs a partir do gráfico de contribuições do dono do repositório
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-dark.svg?color_snake=#00FFFF&color_dots=#161b22,#06395c,#0EA5E9,#00BFFF,#00FFFF
            dist/github-snake.svg?color_snake=#8B5CF6&color_dots=#ebedf0,#b6e3ff,#54aeff,#0969da,#0a3069

      # Publica os SVGs na branch "output" (criada automaticamente na primeira execução)
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
