<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 118" width="100%" style="max-width:600px" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">GitHub activity</title><desc id="d">GitHub activity loading sequence.</desc>
<defs>
<linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0EA5E9"/><stop offset=".5" stop-color="#00FFFF"/><stop offset="1" stop-color="#0EA5E9"/></linearGradient>
<linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00FFFF" stop-opacity="0"/><stop offset=".5" stop-color="#00FFFF" stop-opacity=".10"/><stop offset="1" stop-color="#00FFFF" stop-opacity="0"/></linearGradient>
<linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0EA5E9" stop-opacity="0"/><stop offset=".25" stop-color="#0EA5E9" stop-opacity=".8"/><stop offset=".75" stop-color="#00BFFF" stop-opacity=".8"/><stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/></linearGradient>
<pattern id="lines" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#00BFFF" opacity=".045"/></pattern>
<pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#0EA5E9" stroke-opacity=".05"/></pattern>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
text { font-family: 'Fira Code','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace; font-size: 16px; }
.c { fill:#FFFFFF; } .u { fill:#00FFFF; } .p { fill:#0EA5E9; } .n { fill:#00BFFF; }
.o { fill:#D5E1F2; } .k { fill:#7C8BA3; } .g { fill:#00FF9C; }
.h { font-size:13px; fill:#7C8BA3; letter-spacing:1px; }
.ht { font-size:14px; fill:#FFFFFF; font-weight:600; letter-spacing:1.5px; }
.on { font-size:13px; fill:#00FF9C; letter-spacing:1px; }
.l { opacity:0; animation: show .35s ease-out forwards; }
@keyframes show { from { opacity:0; } to { opacity:1; } }
.dot { animation: pulse 2.5s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.3; } }
.cur { fill:#00FFFF; animation: blink 1s steps(1) infinite; }
@keyframes blink { 0%,50% { opacity:1; } 50.01%,100% { opacity:0; } }
@media (prefers-reduced-motion: reduce) {
  .l { opacity:1; animation:none; }
  .dot, .cur { animation:none; }
  .sc, .mv { display:none; }
}
@keyframes sweep { from { transform: translateY(-60px); } to { transform: translateY(118px); } } .sc { animation: sweep 9s linear infinite; }</style>
</defs>
<clipPath id="clip"><rect x="1" y="1" width="598" height="116" rx="6"/></clipPath><rect x="1" y="1" width="598" height="116" rx="6" fill="#050810"/><g clip-path="url(#clip)"><rect width="600" height="118" fill="url(#grid)"/><g class="l" style="animation-delay:1.00s"><text x="28" y="34" xml:space="preserve"><tspan class="p">&gt; </tspan><tspan class="o">loading GitHub activity...</tspan></text></g><g class="l" style="animation-delay:1.60s"><text x="28" y="62" xml:space="preserve"><tspan class="p">&gt; </tspan><tspan class="o">repository activity detected</tspan></text></g><g class="l" style="animation-delay:2.20s"><text x="28" y="90" xml:space="preserve"><tspan class="p">&gt; </tspan><tspan class="o">contributions updated</tspan></text></g><rect class="cur" x="254" y="76" width="9" height="17"/><rect width="600" height="118" fill="url(#lines)"/><rect class="sc" x="1" y="0" width="598" height="60" fill="url(#scan)"/></g><rect x="1" y="1" width="598" height="116" rx="6" fill="none" stroke="url(#bd)" stroke-opacity=".55"/><g fill="none" stroke="#00FFFF" stroke-width="2" filter="url(#glow)"><path d="M1 16V1H16"/><path d="M584 1H599V16"/><path d="M1 102V117H16"/><path d="M584 117H599V102"/></g>
</svg>
