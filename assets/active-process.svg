<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 270" width="100%" style="max-width:600px" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Atividades em andamento</title><desc id="d">Registro das atividades atuais do Fábio Matheus.</desc>
<defs>
<linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0EA5E9"/><stop offset=".5" stop-color="#00FFFF"/><stop offset="1" stop-color="#0EA5E9"/></linearGradient>
<linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00FFFF" stop-opacity="0"/><stop offset=".5" stop-color="#00FFFF" stop-opacity=".10"/><stop offset="1" stop-color="#00FFFF" stop-opacity="0"/></linearGradient>
<linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0EA5E9" stop-opacity="0"/><stop offset=".25" stop-color="#0EA5E9" stop-opacity=".8"/><stop offset=".75" stop-color="#00BFFF" stop-opacity=".8"/><stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/></linearGradient>
<pattern id="lines" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#00BFFF" opacity=".045"/></pattern>
<pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#0EA5E9" stroke-opacity=".05"/></pattern>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
text { font-family: 'Fira Code','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace; font-size: 16px; }
.c { fill:#FFFFFF; } .u { fill:#00FFFF; } .p { fill:#0EA5E9; } .n { fill:#00BFFF; }
.o { fill:#D5E1F2; } .k { fill:#7C8BA3; } .g { fill:#00FF9C; }
.h { font-size:13px; fill:#7C8BA3; letter-spacing:1px; }
.ht { font-size:14px; fill:#FFFFFF; font-weight:600; letter-spacing:1.5px; }
.on { font-size:13px; fill:#00FF9C; letter-spacing:1px; }
.l { opacity:0; animation: show .35s ease-out forwards; }
@keyframes show { from { opacity:0; } to { opacity:1; } }
.dot { animation: pulse 2.5s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.3; } }
.cur { fill:#00FFFF; animation: blink 1s steps(1) infinite; }
@keyframes blink { 0%,50% { opacity:1; } 50.01%,100% { opacity:0; } }
@media (prefers-reduced-motion: reduce) {
  .l { opacity:1; animation:none; }
  .dot, .cur { animation:none; }
  .sc, .mv { display:none; }
}
@keyframes sweep { from { transform: translateY(-60px); } to { transform: translateY(270px); } } .sc { animation: sweep 9s linear infinite; }</style>
</defs>
<clipPath id="clip"><rect x="1" y="1" width="598" height="268" rx="6"/></clipPath><rect x="1" y="1" width="598" height="268" rx="6" fill="#050810"/><g clip-path="url(#clip)"><rect width="600" height="270" fill="url(#grid)"/><rect x="1" y="1" width="598" height="40" fill="#07101F"/><line x1="1" y1="41" x2="599" y2="41" stroke="#0EA5E9" stroke-opacity=".4"/><text x="20" y="26" class="ht">ATIVIDADES // EM ANDAMENTO</text><circle class="dot" cx="478" cy="21" r="4" fill="#00FF9C" filter="url(#glow)"/><text x="488" y="26" class="on">SISTEMA ONLINE</text><g class="l" style="animation-delay:0.70s"><text x="28" y="82" xml:space="preserve"><tspan class="u">01</tspan><tspan class="p"> // </tspan><tspan class="o">ADS @ UNA BOM DESPACHO (3º período)</tspan></text><circle class="dot" cx="572" cy="77" r="3" fill="#00BFFF" style="animation-delay:0.4s"/></g><g class="l" style="animation-delay:1.00s"><text x="28" y="112" xml:space="preserve"><tspan class="u">02</tspan><tspan class="p"> // </tspan><tspan class="o">CONSTRUINDO PROJETOS PRÁTICOS</tspan></text><circle class="dot" cx="572" cy="107" r="3" fill="#00BFFF" style="animation-delay:0.8s"/></g><g class="l" style="animation-delay:1.30s"><text x="28" y="142" xml:space="preserve"><tspan class="u">03</tspan><tspan class="p"> // </tspan><tspan class="o">FORMAÇÕES NA ALURA</tspan></text><circle class="dot" cx="572" cy="137" r="3" fill="#00BFFF" style="animation-delay:1.2s"/></g><g class="l" style="animation-delay:1.60s"><text x="28" y="172" xml:space="preserve"><tspan class="u">04</tspan><tspan class="p"> // </tspan><tspan class="o">FRONT-END + BACK-END + BANCO DE DADOS</tspan></text><circle class="dot" cx="572" cy="167" r="3" fill="#00BFFF" style="animation-delay:1.6s"/></g><g class="l" style="animation-delay:1.90s"><text x="28" y="202" xml:space="preserve"><tspan class="u">05</tspan><tspan class="p"> // </tspan><tspan class="o">DESENVOLVENDO HABILIDADES INTERPESSOAIS</tspan></text><circle class="dot" cx="572" cy="197" r="3" fill="#00BFFF" style="animation-delay:2.0s"/></g><g class="l" style="animation-delay:2.20s"><text x="28" y="232" xml:space="preserve"><tspan class="u">06</tspan><tspan class="p"> // </tspan><tspan class="o">BUSCANDO A PRIMEIRA OPORTUNIDADE EM TECNOLOGIA</tspan></text><circle class="dot" cx="572" cy="227" r="3" fill="#00BFFF" style="animation-delay:2.4s"/></g><rect width="600" height="270" fill="url(#lines)"/><rect class="sc" x="1" y="0" width="598" height="60" fill="url(#scan)"/></g><rect x="1" y="1" width="598" height="268" rx="6" fill="none" stroke="url(#bd)" stroke-opacity=".55"/><g fill="none" stroke="#00FFFF" stroke-width="2" filter="url(#glow)"><path d="M1 16V1H16"/><path d="M584 1H599V16"/><path d="M1 254V269H16"/><path d="M584 269H599V254"/></g>
</svg>
