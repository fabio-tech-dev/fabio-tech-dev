<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="100%" style="max-width:600px" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Status do sistema — Fábio Matheus</title><desc id="d">Painel de acompanhamento: usuário, curso, foco e andamento dos módulos.</desc>
<defs>
