<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 567" width="100%" style="max-width:600px" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">FM.DEV // System Console — Fábio Matheus</title>
  <desc id="d">Terminal animado com os comandos whoami, education, stack, mission e status.</desc>
  <defs>
    <linearGradient id="bd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0EA5E9"/><stop offset="0.5" stop-color="#00FFFF"/><stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00FFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00FFFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#00FFFF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="lines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#00BFFF" opacity="0.045"/>
    </pattern>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#0EA5E9" stroke-opacity="0.05"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect x="1" y="1" width="598" height="565" rx="6"/></clipPath>
    <style>
      text { font-family: 'Fira Code','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace; font-size: 16px; }
      .u { fill:#00FFFF; } .p { fill:#0EA5E9; } .c { fill:#FFFFFF; } .m { fill:#8B5CF6; }
      .o { fill:#D5E1F2; } .k { fill:#7C8BA3; } .g { fill:#00FF9C; }
      .h { font-size:13px; fill:#7C8BA3; letter-spacing:1px; }
      .ht { font-size:14px; fill:#FFFFFF; font-weight:600; letter-spacing:1.5px; }
      .on { font-size:13px; fill:#00FF9C; letter-spacing:1px; }
      .l { opacity:0; animation: show .3s ease-out forwards; }
      @keyframes show { from { opacity:0; } to { opacity:1; } }
      .cur { fill:#00FFFF; opacity:0; animation: blink 1s steps(1) infinite; }
      @keyframes blink { 0%,50% { opacity:1; } 50.01%,100% { opacity:0; } }
      .dot { animation: pulse 2.5s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.35; } }
      .sc { animation: sweep 8s linear infinite; }
      @keyframes sweep { from { transform: translateY(-60px); } to { transform: translateY(567px); } }
      .sig { stroke-dasharray: 90; animation: dash 4s linear infinite; }
      @keyframes dash { from { stroke-dashoffset: 180; } to { stroke-dashoffset: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .l { opacity:1; animation:none; }
        .cur { opacity:1; animation:none; }
        .dot, .sig { animation:none; }
        .sc { display:none; }
      }
    </style>
  </defs>

  <!-- Janela -->
  <rect x="1" y="1" width="598" height="565" rx="6" fill="#050810"/>
  <g clip-path="url(#clip)">
    <rect width="600" height="567" fill="url(#grid)"/>
    <!-- Barra superior -->
    <rect x="1" y="1" width="598" height="40" fill="#07101F"/>
    <line x1="1" y1="41" x2="599" y2="41" stroke="#0EA5E9" stroke-opacity=".4"/>
    <text x="20" y="26" class="ht">FM.DEV // SYSTEM CONSOLE</text>
    <circle class="dot" cx="478" cy="21" r="4" fill="#00FF9C" filter="url(#glow)"/>
    <text x="488" y="26" class="on">SYSTEM ONLINE</text>
    <!-- Faixa de indicadores -->
    <rect x="1" y="42" width="598" height="24" fill="#0A0F1C"/>
    <text x="20" y="59" class="h">USER: fabio</text>
    <text x="150" y="59" class="h">SESSION: ACTIVE</text>
    <text x="318" y="59" class="h">LATENCY</text>
    <polyline class="sig" points="392,60 402,60 408,52 414,62 420,56 426,60 440,60" fill="none" stroke="#00BFFF" stroke-width="1.5" filter="url(#glow)"/>
    <line x1="1" y1="66" x2="599" y2="66" stroke="#0EA5E9" stroke-opacity=".2"/>
        <g class="l" style="animation-delay:1.10s"><text x="24" y="104" xml:space="preserve"><tspan class="u">fabio@dev</tspan><tspan class="p">:~$ </tspan><tspan class="c">whoami</tspan></text></g>
    <g class="l" style="animation-delay:1.38s"><text x="24" y="125" xml:space="preserve"><tspan class="m">&gt; </tspan><tspan class="o">Fábio Matheus</tspan></text></g>
    <g class="l" style="animation-delay:1.66s"><text x="24" y="146" xml:space="preserve"><tspan class="m">&gt; </tspan><tspan class="o">ADS Student</tspan></text></g>
    <g class="l" style="animation-delay:1.94s"><text x="24" y="167" xml:space="preserve"><tspan class="m">&gt; </tspan><tspan class="o">Full Stack Developer in Training</tspan></text></g>
    <g class="l" style="animation-delay:2.74s"><text x="24" y="198" xml:space="preserve"><tspan class="u">fabio@dev</tspan><tspan class="p">:~$ </tspan><tspan class="c">education --current</tspan></text></g>
    <g class="l" style="animation-delay:3.02s"><text x="24" y="219" xml:space="preserve"><tspan class="k">Institution : </tspan><tspan class="o">Una Bom Despacho</tspan></text></g>
    <g class="l" style="animation-delay:3.30s"><text x="24" y="240" xml:space="preserve"><tspan class="k">Course      : </tspan><tspan class="o">Análise e Desenvolvimento de Sistemas</tspan></text></g>
    <g class="l" style="animation-delay:3.58s"><text x="24" y="261" xml:space="preserve"><tspan class="k">Semester    : </tspan><tspan class="o">3/5</tspan></text></g>
    <g class="l" style="animation-delay:4.38s"><text x="24" y="292" xml:space="preserve"><tspan class="u">fabio@dev</tspan><tspan class="p">:~$ </tspan><tspan class="c">stack --learning</tspan></text></g>
    <g class="l" style="animation-delay:4.66s"><text x="24" y="313" xml:space="preserve"><tspan class="m">&gt; </tspan><tspan class="o">JavaScript // Python // MySQL</tspan></text></g>
    <g class="l" style="animation-delay:4.94s"><text x="24" y="334" xml:space="preserve"><tspan class="m">&gt; </tspan><tspan class="o">HTML // CSS</tspan></text></g>
    <g class="l" style="animation-delay:5.74s"><text x="24" y="365" xml:space="preserve"><tspan class="u">fabio@dev</tspan><tspan class="p">:~$ </tspan><tspan class="c">mission</tspan></text></g>
    <g class="l" style="animation-delay:6.02s"><text x="24" y="386" xml:space="preserve"><tspan class="m">&gt; </tspan><tspan class="o">Build</tspan></text></g>
    <g class="l" style="animation-delay:6.30s"><text x="24" y="407" xml:space="preserve"><tspan class="m">&gt; </tspan><tspan class="o">Learn</tspan></text></g>
    <g class="l" style="animation-delay:6.58s"><text x="24" y="428" xml:space="preserve"><tspan class="m">&gt; </tspan><tspan class="o">Improve</tspan></text></g>
    <g class="l" style="animation-delay:6.86s"><text x="24" y="449" xml:space="preserve"><tspan class="m">&gt; </tspan><tspan class="o">Repeat</tspan></text></g>
    <g class="l" style="animation-delay:7.66s"><text x="24" y="480" xml:space="preserve"><tspan class="u">fabio@dev</tspan><tspan class="p">:~$ </tspan><tspan class="c">status</tspan></text></g>
    <g class="l" style="animation-delay:7.94s"><text x="24" y="501" xml:space="preserve"><tspan class="g">[ONLINE]</tspan><tspan class="o"> Building the next version of myself</tspan></text></g>
    <g class="l" style="animation-delay:8.24s"><text x="24" y="532" xml:space="preserve"><tspan class="u">fabio@dev</tspan><tspan class="p">:~$ </tspan><tspan class="c"></tspan></text></g>
    <rect class="cur" x="148.8" y="518" width="9" height="17" style="animation-delay:8.24s"/>
    <!-- Efeitos -->
    <rect width="600" height="567" fill="url(#lines)" pointer-events="none"/>
    <rect class="sc" x="1" y="0" width="598" height="60" fill="url(#scan)"/>
  </g>

  <!-- Moldura + cantos HUD -->
  <rect x="1" y="1" width="598" height="565" rx="6" fill="none" stroke="url(#bd)" stroke-opacity=".55" stroke-width="1"/>
  <g fill="none" stroke="#00FFFF" stroke-width="2" filter="url(#glow)">
    <path d="M1 18V1H18"/><path d="M582 1H599V18"/>
    <path d="M1 549V566H18"/><path d="M582 566H599V549"/>
  </g>
</svg>
