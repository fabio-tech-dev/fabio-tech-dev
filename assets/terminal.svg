#0EA5E9\"/>\n  <circle cx=\"62\" cy=\"20\" r=\"5.5\" fill=\"#8B5CF6\"/>\n  <text x=\"280\" y=\"24\" text-anchor=\"middle\" class=\"h\">fabio@github: ~</text>\n\n  <!-- whoami -->\n  <g class=\"l\" style=\"animation-delay:0.4s\"><text x=\"24\" y=\"70\" xml:space=\"preserve\"><tspan class=\"u\">fabio@github</tspan><tspan class=\"p\">:~$ </tspan><tspan class=\"c\">whoami</tspan></text></g>\n  <g class=\"l\" style=\"animation-delay:0.7s\"><text x=\"24\" y=\"92\" xml:space=\"preserve\"><tspan class=\"m\">&gt;</tspan><tspan class=\"o\"> Fábio Matheus</tspan></text></g>\n  <g class=\"l\" style=\"animation-delay:1.0s\"><text x=\"24\" y=\"114\" xml:space=\"preserve\"><tspan class=\"m\">&gt;</tspan><tspan class=\"o\"> Estudante de Análise e Desenvolvimento de Sistemas</tspan></text></g>\n  <g class=\"l\" style=\"animation-delay:1.3s\"><text x=\"24\" y=\"136\" xml:space=\"preserve\"><tspan class=\"m\">&gt;</tspan><tspan class=\"o\"> Desenvolvedor Full Stack em Formação</tspan></text></g>\n\n  <!-- education -->\n  <g class=\"l\" style=\"animation-delay:1.9s\"><text x=\"24\" y=\"180\" xml:space=\"preserve\"><tspan class=\"u\">fabio@github</tspan><tspan class=\"p\">:~$ </tspan><tspan class=\"c\">education</tspan></text></g>\n  <g class=\"l\" style=\"animation-delay:2.2s\"><text x=\"24\" y=\"202\" xml:space=\"preserve\"><tspan class=\"m\">&gt;</tspan><tspan class=\"o\"> ADS — Una Bom Despacho</tspan></text></g>\n  <g class=\"l\" style=\"animation-delay:2.5s\"><text x=\"24\" y=\"224\" xml:space=\"preserve\"><tspan class=\"m\">&gt;</tspan><tspan class=\"o\"> 3º período</tspan></text></g>\n\n  <!-- objective -->\n  <g class=\"l\" style=\"animation-delay:3.1s\"><text x=\"24\" y=\"268\" xml:space=\"preserve\"><tspan class=\"u\">fabio@github</tspan><tspan class=\"p\">:~$ </tspan><tspan class=\"c\">objective</tspan></text></g>\n  <g class=\"l\" style=\"animation-delay:3.4s\"><text x=\"24\" y=\"290\" xml:space=\"preserve\"><tspan class=\"m\">&gt;</tspan><tspan class=\"o\"> Primeira oportunidade em tecnologia</tspan></text></g>\n  <g class=\"l\" style=\"animation-delay:3.7s\"><text x=\"24\" y=\"312\" xml:space=\"preserve\"><tspan class=\"m\">&gt;</tspan><tspan class=\"o\"> Estágio / Desenvolvedor Júnior</tspan></text></g>\n\n  <!-- status -->\n  <g class=\"l\" style=\"animation-delay:4.3s\"><text x=\"24\" y=\"356\" xml:space=\"preserve\"><tspan class=\"u\">fabio@github</tspan><tspan class=\"p\">:~$ </tspan><tspan class=\"c\">status</tspan></text></g>\n  <g class=\"l\" style=\"animation-delay:4.6s\"><text x=\"24\" y=\"378\" xml:space=\"preserve\"><tspan class=\"m\">&gt;</tspan><tspan class=\"o\"> Estudando...</tspan></text></g>\n  <g class=\"l\" style=\"animation-delay:4.9s\"><text x=\"24\" y=\"400\" xml:space=\"preserve\"><tspan class=\"m\">&gt;</tspan><tspan class=\"o\"> Programando...</tspan></text></g>\n  <g class=\"l\" style=\"animation-delay:5.2s\"><text x=\"24\" y=\"422\" xml:space=\"preserve\"><tspan class=\"m\">&gt;</tspan><tspan class=\"o\"> Construindo projetos...</tspan></text></g>\n  <g class=\"l\" style=\"animation-delay:5.5s\"><text x=\"24\" y=\"444\" xml:space=\"preserve\"><tspan class=\"m\">&gt;</tspan><tspan class=\"o\"> Evoluindo...</tspan></text></g>\n\n  <!-- prompt final com cursor piscando -->\n  <g class=\"l\" style=\"animation-delay:6.1s\">\n    <text x=\"24\" y=\"488\" xml:space=\"preserve\"><tspan class=\"u\">fabio@github</tspan><tspan class=\"p\">:~$ </tspan></text>\n    <rect class=\"cur\" x=\"168\" y=\"475\" width=\"9\" height=\"16\"/>\n  </g>\n</svg>\n","uri":"repo://fabio-tech-dev/fabio-tech-dev/sha/5632cd32556800bcd3b2fe4e5c334edbcc20bc29/contents/terminal.svg"},"type":"resource"}]}