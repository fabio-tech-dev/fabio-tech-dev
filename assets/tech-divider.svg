<line x1="10" y1="12" x2="590" y2="12" stroke="url(#fade)" stroke-width="1.2"/><path d="M270 12L282 5H318L330 12L318 19H282Z" fill="#050810" stroke="#0EA5E9" stroke-opacity=".8"/><rect class="dot" x="296" y="9" width="8" height="6" fill="#00FFFF" filter="url(#glow)"/><circle class="mv" r="2.2" cy="12" fill="#FFFFFF" filter="url(#glow)"><animate attributeName="cx" values="10;590" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="8s" repeatCount="indefinite"/></circle>
